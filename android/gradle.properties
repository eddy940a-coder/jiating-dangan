org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 关闭 Kotlin 增量编译：本机 Windows Defender 会锁住增量缓存的 .tab 文件，
# 导致 "Could not close incremental caches" 而编译失败。改为全量编译可稳定通过。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# 保持关闭：部分插件（image_gallery_saver_plus / share_plus）仍强制 apply
# kotlin-android，开启内置 Kotlin 会直接构建失败。
# file_picker 缺失的 Kotlin 插件由 android/app/build.gradle.kts 补齐。
android.builtInKotlin=false
